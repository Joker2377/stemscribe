        <text x="480.0" y="160" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle" >每 5 秒聽一段，兩遍錯開拼接</text>
        <text x="672.0" y="160" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle" >對齊時間、去掉雜音和拖長的音</text>
        <text x="864.0" y="160" fill="#4f5d75" font-size="12" font-weight="400" font-family="'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif" text-anchor="middle" >依音色分給高／低兩把</text>
        <text x="748" y="400" fill="#4f5d75" font-size="14" font-weight="400" font-family="'Instrument Serif', 'Noto Serif TC', serif" text-anchor="end" font-style="italic">原曲和 MIDI 用同一個時鐘播放，</text>

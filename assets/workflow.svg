<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-title workflow-desc" id="workflow-root">
        <title id="workflow-title">一首歌怎麼變成多軌 MIDI</title>
        <desc id="workflow-desc">上傳的歌曲先拆成各樂器分軌，AI 逐段聽寫成音符，修整後把吉他分成兩軌，配上節拍合成 MIDI，最後在網頁上和原曲同步播放。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #workflow-root { font-family: 'Geist', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; color: #2d3142; }
      #workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      #workflow-root .diagram-container { overflow-x: visible; }</style>

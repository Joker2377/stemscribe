<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>music_decompose</title>
<style>
  body { margin: 0; display: flex; height: 100vh; font: 13px sans-serif; background: #0f1115; color: #d8dce4; }
  aside { width: 240px; border-right: 1px solid #2c3038; overflow-y: auto; padding: 8px; box-sizing: border-box; flex: none; }
  aside li { list-style: none; padding: 6px; border-radius: 4px; cursor: pointer; }
  aside li:hover, aside li.sel { background: #23262d; }
  aside ul { padding: 0; }
  .st { float: right; font-size: 11px; color: #8a90a0; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #2c3038; }
  header h2 { margin: 0; font-size: 15px; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  button { background: #23262d; color: inherit; border: 1px solid #3a3f4b; border-radius: 3px; padding: 3px 8px; cursor: pointer; }
  button.on { background: #4a6bd8; border-color: #4a6bd8; }
  a { color: #8fb0ff; }
  #view { flex: 1; overflow-y: auto; }
  #roll { display: flex; }
  #heads { width: 190px; flex: none; }
  #heads .head { height: 96px; box-sizing: border-box; border-top: 1px solid #2c3038; padding: 6px 8px; }
  #heads .name { font-weight: bold; margin-bottom: 2px; }
  #heads .inst { color: #8a90a0; font-size: 11px; margin-bottom: 6px; }
  #heads input[type=range] { width: 90px; vertical-align: middle; }
  #lanes { flex: 1; min-width: 0; display: block; cursor: text; }
  #progress { padding: 16px; }
  #progress li { padding: 2px 0; }
  pre { background: #16181d; padding: 8px; white-space: pre-wrap; }
  .hint { color: #8a90a0; font-size: 11px; }
</style>
</head>
<body>
<aside>
  <label><button onclick="this.nextElementSibling.click()">上傳歌曲</button><input id="upload" type="file" accept="audio/*" hidden></label>
  <ul id="songs"></ul>
</aside>
<main>
  <header>
    <h2 id="title">選一首歌</h2>
    <span id="clock">0:00.0</span>
    <button id="play" disabled>▶ 播放</button>
    <label>音量 <input id="volume" type="range" min="0" max="1.5" step="0.01" value="1"></label>
    <label><span id="audio">原曲</span> <input id="balance" type="range" min="0" max="1" step="0.01" value="0.5"> MIDI</label>
    <a id="download" hidden>song.mid</a>
  </header>
  <div id="view">
    <div id="progress" hidden></div>
    <div id="roll" hidden><div id="heads"></div><canvas id="lanes"></canvas></div>
  </div>
  <div class="hint" style="padding: 4px 12px">空白鍵播放／暫停 · 點捲軸跳轉 · 滾輪捲動 · Ctrl+滾輪縮放 · M 靜音 S 獨奏 · 雙擊滑桿回預設</div>
</main>
<script type="module" src="/web/app.js"></script>
</body>
</html>
